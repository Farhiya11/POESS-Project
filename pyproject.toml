[project]
name = "poess-project"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["dcr-sdk"]

[tool.uv]
package = false

[tool.uv.sources]
dcr-sdk = { workspace = true }

[tool.uv.workspace]
members = ["pais/dcr/sdk"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["pais/dcr/sdk/tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 80
src = ["pais/dcr/sdk/src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
