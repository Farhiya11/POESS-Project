[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcr-engine"
version = "0.0.1"
description = "POESS engine for managing DCR graphs and running simulations"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Alejandro Garcia", email = "alga@gripgrab.com" },
]
dependencies = [
    "dcr-sdk",
]

[project.urls]
Source = "https://github.com/Farhiya11/POESS-Project/tree/main/pais/dcr/engine"

[tool.uv.sources]
dcr-sdk = { workspace = true }
