services:
  api_adapter:
    build: ./sources/api_adapter
    container_name: api-adapter
    ports:
      - "5000:5000"
    environment:
      INTEGRATION_URL: http://communication:5001
    depends_on:
      - communication

  communication:
    build: ./integration
    container_name: communication
    ports:
      - "5001:5001"
    volumes:
      - ./pais/bpmn/microservice:/bpmn:ro
    environment:
      ZEEBE_ADDRESS: zeebe:26500
      BPMN_FILE: /bpmn/food_order.bpmn
      SIDDHI_CALLBACK_URL: http://siddhi:7072/middleman
    depends_on:
      - zeebe
      - siddhi

  siddhi:
    build: ./cep
    container_name: siddhi-runtime
    ports:
      - "7071:7071"
      - "7072:7072"
      - "7073:7073"
      - "9390:9390"
    depends_on:
      - event_logs_service

  microservice:
    build:
      context: ./pais/dcr/microservice
      additional_contexts:
        dcr-sdk: ./pais/dcr/sdk
    container_name: microservice
    ports:
      - "5002:5001"
    env_file:
      - ./pais/dcr/microservice/.env
    environment:
      SIDDHI_CALLBACK_URL: http://siddhi:7072/middleman
    depends_on:
      - siddhi


  event_logs_service:
    build: ./event_logs_service/service
    container_name: event_logs_service-service
    ports:
      - "5010:5010"
    volumes:
      - ./event_logs_service/service/logs:/logs
      - ./event_logs_service/service/XES:/XES

  zeebe:
    image: camunda/zeebe:8.8.0
    container_name: zeebe
    ports:
      - "26501:26500"
      - "9601:9600"
    environment:
      CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI: "true"
      CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED: "false"
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME: io.camunda.zeebe.exporter.ElasticsearchExporter
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  operate:
    image: camunda/operate:8.8.0
    container_name: operate
    ports:
      - "8081:8080"
    environment:
      CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS: zeebe:26500
      CAMUNDA_OPERATE_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_DATA_SECONDARY_STORAGE_ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      zeebe:
        condition: service_started
      elasticsearch:
        condition: service_healthy
