services:
  api_adapter:
    build: ./sources/api_adapter
    container_name: api-adapter
    ports:
      - "5000:5000"
    environment:
      SIDDHI_URL: http://siddhi:7071/customer
      SIDDHI_DCR_URL: http://siddhi:7074/customer
      PREPAREDNESS_DECISION_SINK_URL: http://siddhi:7077/forecast-refreshes
      WATER_LEVEL_OBSERVATION_SINK_URL: "${WATER_LEVEL_OBSERVATION_SINK_URL:-http://siddhi:7076/water-level-observations}"
      PREPAREDNESS_WARNING_POLICY_JSON:
    depends_on:
      communication:
        condition: service_healthy
      siddhi:
        condition: service_healthy

  communication:
    build: ./integration
    container_name: communication
    ports:
      - "5001:5001"
    volumes:
      - ./pais/bpmn/microservice:/bpmn:ro
      - preparedness_warning_state:/data
    environment:
      ZEEBE_ADDRESS: zeebe:26500
      BPMN_FILE: /bpmn/food_order.bpmn
      PREPAREDNESS_WARNING_BPMN_FILE: "${PREPAREDNESS_WARNING_BPMN_FILE:-/bpmn/Disaster_Attention_Protocol_camunda.bpmn}"
      PREPAREDNESS_WARNING_PROCESS_ID: "${PREPAREDNESS_WARNING_PROCESS_ID:-Process_0q7dfku}"
      SIDDHI_CALLBACK_URL: http://siddhi:7072/middleman
      DCR_SIDDHI_CALLBACK_URL: http://siddhi:7075/middleman
      DCR_SERVICE_URL: http://microservice:5001
      DCR_GRAPH_TITLE: "${DCR_GRAPH_TITLE:-}"
      PREPAREDNESS_WARNING_STATE_FILE: /data/preparedness_warning_episodes.json
    depends_on:
      zeebe:
        condition: service_healthy
      siddhi:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health')"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s

  siddhi:
    build: ./cep
    container_name: siddhi-runtime
    ports:
      - "7071:7071"
      - "7072:7072"
      - "7073:7073"
      - "7074:7074"
      - "7075:7075"
      - "7076:7076"
      - "7077:7077"
      - "9390:9390"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--post-data={\"status\":\"ok\"}",
          "--header=Content-Type: application/json",
          "-O",
          "/dev/null",
          "http://127.0.0.1:7073/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      - event_logs_service

  microservice:
    profiles:
      - dcr
    build:
      context: ./pais/dcr/microservice
      additional_contexts:
        dcr-sdk: ./pais/dcr/sdk
        dcr-engine: ./pais/dcr/engine
    container_name: microservice
    ports:
      - "5002:5001"
    environment:
      DCR_USERNAME: "${DCR_USERNAME:-}"
      DCR_PASSWORD: "${DCR_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


  event_logs_service:
    build: ./event_logs_service/service
    container_name: event-logs-service
    ports:
      - "5010:5010"
    volumes:
      - ./event_logs_service/service/logs:/logs
      - ./event_logs_service/service/XES:/XES

  zeebe:
    image: camunda/zeebe:8.8.46
    container_name: zeebe
    ports:
      - "26501:26500"
      - "9601:9600"
    environment:
      CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI: "true"
      CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED: "false"
      CAMUNDA_DATA_SECONDARY_STORAGE_ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9600/actuator/health/readiness",
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  operate:
    image: camunda/operate:8.8.46
    container_name: operate
    ports:
      - "8081:8080"
    environment:
      CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS: zeebe:26500
      CAMUNDA_OPERATE_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_DATA_SECONDARY_STORAGE_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI: "true"
      CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED: "false"
    depends_on:
      zeebe:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
volumes:
  preparedness_warning_state:
